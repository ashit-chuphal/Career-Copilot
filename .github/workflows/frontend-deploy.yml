name: Frontend ECR Push

on:
  workflow_dispatch:

jobs:
  build-and-push:

    runs-on: ubuntu-latest

    steps:

      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ secrets.AWS_REGION }}

      - name: Login to ECR
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build Frontend Image
        run: docker build -t careercopilot-frontend ./client

      - name: Tag Frontend Image
        run: docker tag careercopilot-frontend:latest 670839969318.dkr.ecr.us-east-1.amazonaws.com/careercopilot-frontend:latest

      - name: Push Frontend Image
        run: docker push 670839969318.dkr.ecr.us-east-1.amazonaws.com/careercopilot-frontend:latest