name: Backend Deploy

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: us-east-1

      - name: Login to ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build Backend Image
        run: |
          docker build -t careercopilot-backend ./server

      - name: Tag Backend Image
        run: |
          docker tag careercopilot-backend:latest \
          670839969318.dkr.ecr.us-east-1.amazonaws.com/careercopilot-backend:${{ github.sha }}

      - name: Push Backend Image
        run: |
          docker push \
          670839969318.dkr.ecr.us-east-1.amazonaws.com/careercopilot-backend:${{ github.sha }}

      - name: Download Current Task Definition
        run: |
          aws ecs describe-task-definition \
            --task-definition careercopilot-backend \
            --query taskDefinition \
            > task-definition.json

      - name: Render New Task Definition
        id: task-def
        uses: aws-actions/amazon-ecs-render-task-definition@v1
        with:
          task-definition: task-definition.json
          container-name: backend
          image: 670839969318.dkr.ecr.us-east-1.amazonaws.com/careercopilot-backend:${{ github.sha }}

      - name: Deploy Backend Service
        uses: aws-actions/amazon-ecs-deploy-task-definition@v2
        with:
          task-definition: ${{ steps.task-def.outputs.task-definition }}
          service: careercopilot-backend-service
          cluster: CareerCopilotCluster
          wait-for-service-stability: true