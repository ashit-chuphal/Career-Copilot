# Docker Compose file for CareerCopilot application

# This docker-compose.yml file defines three services: postgres, backend, and frontend.
services:

# The PostgreSQL service uses the official PostgreSQL 15 image. It sets environment 
# variables for the database user, password, and name, which are defined in the .env file.
# The service maps port 5432 to allow access to the database from the host machine and uses
# a named volume for data persistence.
  postgres:
    image: postgres:15
    container_name: careercopilot-db
    env_file:
    - ./server/.env
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data

# The backend service builds the Flask application from the server directory 
# and maps port 5000. It also sets environment variables for database connection, 
# OpenAI API key, Google OAuth credentials, JWT secret, and client URL. The backend 
# service depends on the PostgreSQL service to be up and running before it starts.
  backend:
    build: ./server
    container_name: careercopilot-backend
    ports:
      - "5000:5000"
    env_file:
      - ./server/.env
    volumes:
      - ./server:/app
      - /app/node_modules
    depends_on:
      - postgres

# The frontend service serves the React application and depends on the backend service 
# to be up and running. It maps port 3000 to port 80 in the container, allowing access
# to the frontend application through localhost:3000.
  frontend:
    build: ./client
    container_name: careercopilot-frontend
    ports:
      - "3000:80"
    volumes:
      - ./client:/app
      - /app/node_modules
    depends_on:
      - backend

# Define the volume for PostgreSQL data persistence
volumes:
  postgres-data: